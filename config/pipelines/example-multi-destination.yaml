name: example-multi-destination
description: Load data to multiple destinations (database + webhook + notification)
version: "1.0"

tags:
  - example
  - fan-out
  - multi-destination

enabled: true

steps:
  - name: extract_events
    type: extract
    connector: rest-api-source
    method: GET
    path: /api/events
    params:
      query_params:
        since: "2024-01-01"
    on_error: fail_pipeline

  - name: transform_events
    type: transform
    mapping_ref: event-mapping
    on_error: fail_pipeline

  # Fan-out to multiple destinations
  - name: load_to_database
    type: load
    connector: postgres-output
    operation: insert
    on_error: continue  # Don't fail pipeline if DB fails

  - name: load_to_webhook
    type: load
    connector: webhook-output
    params:
      path: /webhooks/events
    on_error: continue  # Don't fail pipeline if webhook fails

  - name: notify_completion
    type: load
    connector: notification-webhook
    params:
      path: /notify/pipeline-complete
      method: POST
    on_error: skip_step  # Optional notification
