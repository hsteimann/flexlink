# PriceEdge Standard Mapping
# Transforms PriceEdge API responses to standardized format

name: priceedge-standard
description: |
  Standard mapping for PriceEdge suggested prices API.
  Extracts nested data, normalizes field names, and validates data quality.

mappings:
  # Extract nested data array
  - source_field: Data.data
    target_field: items

  # Extract total count
  - source_field: Data.total
    target_field: totalItems
    transformation: int

  # Extract page number
  - source_field: Data.page
    target_field: currentPage
    transformation: int

# Validation rules for transformed data
validation:
  rules:
    # Validate items array exists
    - field: items
      required: true

    # Validate totalItems is positive integer
    - field: totalItems
      type: int
      min: 0
      required: true

    # Validate currentPage is positive integer
    - field: currentPage
      type: int
      min: 1
      required: false

  # Error handling strategy
  on_validation_error: log_and_continue
  log_errors: true
