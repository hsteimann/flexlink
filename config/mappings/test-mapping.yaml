name: test-mapping
description: Test mapping for unit tests

mappings:
  - source_field: old_field
    target_field: new_field
    transformation: upper

  - source_field: price
    target_field: amount
    transformation: float

validation:
  rules:
    - field: amount
      type: float
      min: 0
      required: true
  on_validation_error: skip_row
  log_errors: true
