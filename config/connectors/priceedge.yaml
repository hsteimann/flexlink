# PriceEdge API Connector Configuration
# Pricing platform for margin and competitor-based price calculations
# Documentation: https://priceedge.mintlify.app/

name: priceedge
type: rest
base_url: ${PRICEEDGE_BASE_URL}  # e.g., https://yourcompany-staging.priceedge.eu/papi
auth:
  type: api_key
  credentials:
    header: Authorization
    key: ApiKey ${PRICEEDGE_KEY_NAME}:${PRICEEDGE_API_TOKEN}
headers:
  Content-Type: application/json
  Accept: application/json
  User-Agent: FlexLink-Middleware/0.1.0
timeout: 30
retry_attempts: 3
enabled: true
