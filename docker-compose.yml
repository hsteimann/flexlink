version: '3.8'

services:
  flexlink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flexlink-middleware
    ports:
      - "8000:8000"
    volumes:
      # Mount config directory for easy configuration updates
      - ./config:/app/config:ro
      # Mount data directories for persistence
      - ./data/uploads:/app/data/uploads
      - ./data/downloads:/app/data/downloads
      - ./data/samples:/app/data/samples:ro
    env_file:
      - .env  # Load environment variables from .env file (create from .env.example)
    environment:
      # Override specific settings for Docker environment
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UPLOAD_DIR=/app/data/uploads
      - DOWNLOAD_DIR=/app/data/downloads
    networks:
      - flexlink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  flexlink-network:
    driver: bridge

# Optional: Add volume definitions for explicit volume management
volumes:
  flexlink-uploads:
    driver: local
  flexlink-downloads:
    driver: local
