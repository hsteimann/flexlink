name: example-pagination
description: Extract large dataset with automatic pagination and retry logic
version: "1.0"

tags:
  - example
  - pagination
  - advanced

enabled: true

steps:
  - name: extract_all_products
    type: extract
    connector: rest-api-source
    method: GET
    path: /api/products

    # Pagination configuration
    pagination:
      enabled: true
      strategy: offset  # offset | cursor | page
      page_size: 100
      max_pages: 10
      data_path: data.products  # Nested response path

    # Retry policy
    retry_policy:
      max_attempts: 3
      backoff_strategy: exponential
      backoff_factor: 2.0
      initial_delay_seconds: 1.0

    on_error: fail_pipeline

  - name: transform_products
    type: transform
    mapping_ref: product-mapping
    on_error: skip_step

  - name: load_to_webhook
    type: load
    connector: webhook-output

    # Batch configuration
    batch_config:
      enabled: true
      batch_size: 50
      wrapper_key: items

    on_error: continue
