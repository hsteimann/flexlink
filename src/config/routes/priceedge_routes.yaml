# PriceEdge API Routes Configuration
# Real-world pricing operations for staging environment

# ========================================
# Suggested Prices
# ========================================

# Get suggested prices table schema/metadata (GET)
- path: /pricing/suggested-prices/schema
  method: GET
  connector: priceedge
  target_path: /api/tables/Item_PriceList_SuggestedPrices_Suggested_Price
  transformations: []

# Get suggested prices with filters (POST)
- path: /pricing/suggested-prices
  method: POST
  connector: priceedge
  target_path: /api/tables/Item_PriceList_SuggestedPrices_Suggested_Price
  transformations: []  # Request transformations

  # Week 2 - Phase 2: Use mapping reference instead of inline transformations
  mapping_ref: priceedge-standard

  # OLD (Week 1 - Phase 2): Inline response transformations
  # response_transformations:
  #   - source_field: Data.data
  #     target_field: items
  #   - source_field: Data.total
  #     target_field: totalItems

